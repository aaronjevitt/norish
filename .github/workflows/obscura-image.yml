name: Publish Obscura image

# The rendered-page browser is published on its own cadence, not with every
# application release: it changes only when `docker/obscura/pin.env` moves.
# Bumping the pin is enough. The push to `rc/**` publishes the new tag, and the
# push to `main` moves `latest` to it, the way the Norish image is promoted.
on:
  workflow_dispatch:
    inputs:
      allow-overwrite:
        description: >-
          Republish even if the tag already exists. Off by default because the
          tag is meant to be immutable — bump the build counter in pin.env
          instead of overwriting what operators are already running.
        type: boolean
        default: false
  # Publishes the pinned tag when it is not on the registry yet. A push that
  # changes the build without bumping the pin finds its tag there and does
  # nothing.
  push:
    branches:
      - main
      - "rc/**"
    paths:
      - "docker/obscura/**"
      - ".github/workflows/obscura-image.yml"
  # Build-only validation. A PR that edits the image build assembles it for
  # both architectures before merge; nothing is pushed.
  pull_request:
    paths:
      - "docker/obscura/**"
      - ".github/workflows/obscura-image.yml"

permissions:
  contents: read

concurrency:
  group: obscura-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    name: Read pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No `image` output: its value contains the Docker Hub username, which is a
    # secret, so Actions drops it from job outputs ("may contain secret"). The
    # jobs that need the image name read it from pin.env themselves.
    outputs:
      tag: ${{ steps.pin.outputs.tag }}
      repo: ${{ steps.pin.outputs.repo }}
      version: ${{ steps.pin.outputs.version }}
      arches: ${{ steps.pin.outputs.arches }}
      publish: ${{ steps.plan.outputs.publish }}
      promote: ${{ steps.plan.outputs.promote }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read pin.env
        id: pin
        run: |
          set -euo pipefail
          set -a
          . docker/obscura/pin.env
          set +a
          {
            echo "image=${OBSCURA_IMAGE}"
            echo "tag=${OBSCURA_IMAGE_TAG}"
            echo "repo=${OBSCURA_REPO}"
            echo "version=${OBSCURA_VERSION}"
          } >> "$GITHUB_OUTPUT"
          # Both architectures either way: the job is a download and a copy, so
          # validating a PR against both costs a minute and catches a release
          # that is missing an arm64 archive before it reaches a publish.
          echo 'arches=["amd64", "arm64"]' >> "$GITHUB_OUTPUT"

      # Authenticated so an anonymous pull-rate limit cannot be mistaken for
      # "tag does not exist" by the check below.
      - name: Login to container registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: ./tooling/github/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # publish: build and push the pinned tag. A manual run refuses a tag that
      # exists unless told to overwrite it; a push skips it.
      # promote: move `latest` to the pinned tag, only from main.
      - name: Decide what to publish
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ALLOW_OVERWRITE: ${{ inputs.allow-overwrite }}
          IMAGE: ${{ steps.pin.outputs.image }}
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          set -euo pipefail
          publish=false
          promote=false
          if [ "$EVENT" != "pull_request" ]; then
            ref="${IMAGE}:${TAG}"
            if ! docker buildx imagetools inspect --raw "$ref" >/dev/null 2>&1; then
              echo "$ref is unpublished — publishing."
              publish=true
            elif [ "$EVENT" = "workflow_dispatch" ] && [ "$ALLOW_OVERWRITE" = "true" ]; then
              echo "$ref is already published — overwriting, as asked."
              publish=true
            elif [ "$EVENT" = "workflow_dispatch" ]; then
              echo "$ref is already published. Bump OBSCURA_IMAGE_TAG in docker/obscura/pin.env," >&2
              echo "or re-run with allow-overwrite if you really mean to replace it." >&2
              exit 1
            else
              echo "$ref is already published — nothing to build."
            fi
            if [ "$REF" = "refs/heads/main" ]; then promote=true; fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "promote=$promote" >> "$GITHUB_OUTPUT"

  build:
    name: linux/${{ matrix.arch }}
    needs: pin
    if: ${{ github.event_name == 'pull_request' || needs.pin.outputs.publish == 'true' }}
    # Native runners per architecture, so the fetch stage's shell runs directly
    # rather than under QEMU.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Fetch and repackage — there is no compile here.
    timeout-minutes: 20
    env:
      HAS_REGISTRY_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.pin.outputs.arches) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read image name
        run: |
          set -euo pipefail
          set -a
          . docker/obscura/pin.env
          set +a
          echo "IMAGE=${OBSCURA_IMAGE}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Non-push builds log in too: the Debian and distroless base images come
      # from rate-limited registries that runners share an IP on. Guarded on the
      # secret so fork PRs pull anonymously instead of failing a login.
      - name: Login to container registry
        if: ${{ needs.pin.outputs.publish == 'true' || env.HAS_REGISTRY_CREDS == 'true' }}
        uses: ./tooling/github/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Resolve build output
        id: mode
        env:
          PUBLISH: ${{ needs.pin.outputs.publish }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ]; then
            echo "outputs=type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" >> "$GITHUB_OUTPUT"
          else
            # cacheonly: the point of a PR build is that the Dockerfile still
            # resolves and the archive is still fetchable, not the artifact.
            echo "outputs=type=cacheonly" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          # The build downloads Obscura itself, so the context is just this folder.
          context: ./docker/obscura
          file: ./docker/obscura/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            OBSCURA_REPO=${{ needs.pin.outputs.repo }}
            OBSCURA_VERSION=${{ needs.pin.outputs.version }}
          outputs: ${{ steps.mode.outputs.outputs }}

      # buildx cannot hand digests between jobs directly, so each becomes an
      # empty marker file named after the hash.
      - name: Export digest
        if: ${{ needs.pin.outputs.publish == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: ${{ needs.pin.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: obscura-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Manifest
    if: ${{ needs.pin.outputs.publish == 'true' }}
    needs: [pin, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read image name
        run: |
          set -euo pipefail
          set -a
          . docker/obscura/pin.env
          set +a
          echo "IMAGE=${OBSCURA_IMAGE}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: obscura-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to container registry
        uses: ./tooling/github/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # One immutable tag: the shipped Compose files pin it, so an ordinary
      # `docker compose pull` cannot change the browser under a running Norish
      # release. `latest` is the promote job's.
      - name: Create manifest
        working-directory: /tmp/digests
        env:
          TAG: ${{ needs.pin.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          if [ ${#refs[@]} -eq 0 ]; then
            echo "No digests were produced by the build jobs." >&2
            exit 1
          fi
          echo "Assembling ${IMAGE}:${TAG} from: ${refs[*]}"
          docker buildx imagetools create --tag "${IMAGE}:${TAG}" "${refs[@]}"

      # Not a gate — `merge` already needs both `build` jobs, and each uploads
      # its digest with `if-no-files-found: error`. This is the publish log's
      # record of what landed, for whoever reads it later.
      - name: Show what was published
        env:
          TAG: ${{ needs.pin.outputs.tag }}
        run: docker buildx imagetools inspect "${IMAGE}:${TAG}"

  # `latest` is the rolling release: the pinned tag main ships. It runs after a
  # publish, or alone when main merged a tag an rc push already published.
  promote:
    name: Move latest
    needs: [pin, merge]
    if: ${{ !failure() && !cancelled() && needs.pin.outputs.promote == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read image name
        run: |
          set -euo pipefail
          set -a
          . docker/obscura/pin.env
          set +a
          echo "IMAGE=${OBSCURA_IMAGE}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to container registry
        uses: ./tooling/github/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Point latest at the pinned tag
        env:
          TAG: ${{ needs.pin.outputs.tag }}
        run: docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${TAG}"
